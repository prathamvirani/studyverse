name: study-phase00
services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: study
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run dev}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Run npm run dev}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?Run npm run dev}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/init-postgres.sh:/docker-entrypoint-initdb.d/00-study.sh:ro
    ports: ['127.0.0.1:5433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d study']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run npm run dev}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run npm run dev}
    command:
      ['sh', '-c', 'exec redis-server --appendonly no --save '''' --requirepass "$$REDIS_PASSWORD"']
    ports: ['127.0.0.1:6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: api }
    environment:
      MIGRATION_DATABASE_URL: postgresql://study_migrator:${MIGRATION_PASSWORD}@postgres:5432/study
    command: ['node', 'dist/api/migrate.mjs']
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: api }
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3001
      APP_ORIGIN: https://localhost:8443
      DATABASE_URL: postgresql://study_runtime:${RUNTIME_PASSWORD}@postgres:5432/study
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LOG_LEVEL: info
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/ready',{redirect:'error',signal:AbortSignal.timeout(3000)}).then(async r=>process.exit(r.status===200&&(await r.json()).status==='ok'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build: { context: ., dockerfile: infra/docker/Dockerfile, target: web }
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  proxy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment: { APP_ORIGIN: 'https://localhost:8443' }
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
volumes:
  postgres-data:
  caddy-data:
